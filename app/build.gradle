plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def playerUrl = (project.findProperty('playerUrl') ?: 'https://iptv.bepllorens.com/player.html').toString()
def allowInsecureSsl = (project.findProperty('allowInsecureSsl') ?: 'true').toString().toBoolean()
def forceFirestickUrl = (project.findProperty('forceFirestickUrl') ?: 'false').toString().toBoolean()
def firestickLockedUrl = (project.findProperty('firestickLockedUrl') ?: '').toString()

def debugPlayerUrl = (project.findProperty('debugPlayerUrl') ?: playerUrl).toString()
def debugAllowInsecureSsl = (project.findProperty('debugAllowInsecureSsl') ?: allowInsecureSsl.toString()).toString().toBoolean()
def debugForceFirestickUrl = (project.findProperty('debugForceFirestickUrl') ?: forceFirestickUrl.toString()).toString().toBoolean()
def debugFirestickLockedUrl = (project.findProperty('debugFirestickLockedUrl') ?: firestickLockedUrl).toString()

def releasePlayerUrl = (project.findProperty('releasePlayerUrl') ?: 'https://iptv.bepllorens.com/player.html').toString()
def releaseAllowInsecureSsl = (project.findProperty('releaseAllowInsecureSsl') ?: 'false').toString().toBoolean()
def releaseForceFirestickUrl = (project.findProperty('releaseForceFirestickUrl') ?: 'false').toString().toBoolean()
def releaseFirestickLockedUrl = (project.findProperty('releaseFirestickLockedUrl') ?: '').toString()
def standaloneMode = (project.findProperty('standaloneMode') ?: 'true').toString().toBoolean()
def catalogSnapshotUrl = (project.findProperty('catalogSnapshotUrl') ?: '').toString()
def offlineBaseUrl = (project.findProperty('offlineBaseUrl') ?: 'https://fire.tvbep.com').toString()
def emergencyBaseUrl = (project.findProperty('emergencyBaseUrl') ?: 'https://direct.tvbep.com').toString()
def updateChannel = (project.findProperty('updateChannel') ?: 'stable').toString()
def dnsHealingRecoveryFirst = (project.findProperty('dnsHealingRecoveryFirst') ?: 'false').toString().toBoolean()
def fireAbiOnly = (project.findProperty('fireAbiOnly') ?: 'false').toString().toBoolean()
def emulatorAbiOnly = (project.findProperty('emulatorAbiOnly') ?: 'false').toString().toBoolean()
if (emulatorAbiOnly && (fireAbiOnly || updateChannel != 'beta')) {
    throw new GradleException('emulatorAbiOnly requires beta and fireAbiOnly=false')
}

def offlineSnapshotPublicKey = (project.findProperty('offlineSnapshotPublicKey') ?: '').toString()
def offlineSnapshotKeyId = (project.findProperty('offlineSnapshotKeyId') ?: 'offline-snapshot-rsa-20260520').toString()

def escapedDebugPlayerUrl = debugPlayerUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedDebugFirestickLockedUrl = debugFirestickLockedUrl
    .replace('\\', '\\\\')
    .replace('"', '\\"')
def escapedReleasePlayerUrl = releasePlayerUrl
    .replace('\\', '\\\\')
    .replace('"', '\\"')
def escapedReleaseFirestickLockedUrl = releaseFirestickLockedUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedCatalogSnapshotUrl = catalogSnapshotUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedOfflineBaseUrl = offlineBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedEmergencyBaseUrl = emergencyBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedUpdateChannel = updateChannel
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedOfflineSnapshotPublicKey = offlineSnapshotPublicKey
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedOfflineSnapshotKeyId = offlineSnapshotKeyId
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace = 'com.drbep.tvplayer'
    compileSdk 36

    defaultConfig {
        buildConfigField "boolean", "BOUNDED_ARTWORK_REQUESTS", (updateChannel == "beta" && (project.findProperty("boundedArtworkRequests") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "COOPERATIVE_IMPORTS", (updateChannel == "beta" && (project.findProperty("cooperativeImports") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "COOPERATIVE_METADATA", (updateChannel == "beta" && (project.findProperty("cooperativeMetadata") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "CATCHUP_SEARCH_INDEX", (updateChannel == "beta" && (project.findProperty("catchupSearchIndex") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "COALESCE_ARTWORK_GRIDS", (updateChannel == "beta" && (project.findProperty("coalesceArtworkGrids") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "REUSE_PLAYBACK_TRANSPORT", (updateChannel == "beta" && (project.findProperty("reusePlaybackTransport") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "COALESCE_REMOTE_ZAP", (updateChannel == "beta" && (project.findProperty("coalesceRemoteZap") ?: "false").toString().toBoolean()).toString()
        buildConfigField "boolean", "FAST_HLS_STARTUP", (updateChannel == "beta" && (project.findProperty("fastHlsStartup") ?: "false").toString().toBoolean()).toString()
        applicationId "com.drbep.tvplayer.offline"
        minSdk 23
        targetSdk 34
        versionCode 773
        versionName "2.0.773-beta-tv-guide"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            if (emulatorAbiOnly) {
                abiFilters 'x86_64'
            } else if (fireAbiOnly) {
                abiFilters 'armeabi-v7a'
            } else {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        manifestPlaceholders = [
                appProfileable: ((project.findProperty("profileBeta") ?: "false").toString().toBoolean() && updateChannel == "beta").toString(),
                appAllowBackup: "false",
                appFullBackupContent: "false",
                appUsesCleartextTraffic: "false"
        ]
    }

    signingConfigs {
        release {
            def releaseStoreFile = project.findProperty('DRBEP_RELEASE_STORE_FILE') ?: System.getenv('DRBEP_RELEASE_STORE_FILE')
            def releaseStorePassword = project.findProperty('DRBEP_RELEASE_STORE_PASSWORD') ?: System.getenv('DRBEP_RELEASE_STORE_PASSWORD')
            def releaseKeyAlias = project.findProperty('DRBEP_RELEASE_KEY_ALIAS') ?: System.getenv('DRBEP_RELEASE_KEY_ALIAS')
            def releaseKeyPassword = project.findProperty('DRBEP_RELEASE_KEY_PASSWORD') ?: System.getenv('DRBEP_RELEASE_KEY_PASSWORD')
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (emulatorAbiOnly) versionNameSuffix '-emulator-x86_64'
            manifestPlaceholders = [
                    appProfileable: ((project.findProperty("profileBeta") ?: "false").toString().toBoolean() && updateChannel == "beta").toString(),
                appAllowBackup: "false",
                    appFullBackupContent: "false",
                    appUsesCleartextTraffic: "true"
            ]
            buildConfigField "String", "PLAYER_URL", "\"${escapedDebugPlayerUrl}\""
            buildConfigField "boolean", "ALLOW_INSECURE_SSL", debugAllowInsecureSsl.toString()
            buildConfigField "boolean", "FORCE_FIRESTICK_URL", debugForceFirestickUrl.toString()
            buildConfigField "String", "FIRESTICK_LOCKED_URL", "\"${escapedDebugFirestickLockedUrl}\""
            buildConfigField "boolean", "STANDALONE_MODE", standaloneMode.toString()
            buildConfigField "String", "CATALOG_SNAPSHOT_URL", "\"${escapedCatalogSnapshotUrl}\""
            buildConfigField "String", "OFFLINE_BASE_URL", "\"${escapedOfflineBaseUrl}\""
            buildConfigField "String", "EMERGENCY_BASE_URL", "\"${escapedEmergencyBaseUrl}\""
            buildConfigField "String", "UPDATE_CHANNEL", "\"${escapedUpdateChannel}\""
            buildConfigField "boolean", "DNS_HEALING_RECOVERY_FIRST", dnsHealingRecoveryFirst.toString()
            buildConfigField "boolean", "LOG_VERBOSE", "true"
            buildConfigField "String", "OFFLINE_SNAPSHOT_PUBLIC_KEY", "\"${escapedOfflineSnapshotPublicKey}\""
            buildConfigField "String", "OFFLINE_SNAPSHOT_KEY_ID", "\"${escapedOfflineSnapshotKeyId}\""
        }
        release {
            // CI and contributor builds can produce an unsigned release APK;
            // publication still uses the configured production keystore.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders = [
                    appProfileable: ((project.findProperty("profileBeta") ?: "false").toString().toBoolean() && updateChannel == "beta").toString(),
                appAllowBackup: "false",
                    appFullBackupContent: "false",
                    appUsesCleartextTraffic: "false"
            ]
            buildConfigField "String", "PLAYER_URL", "\"${escapedReleasePlayerUrl}\""
            buildConfigField "boolean", "ALLOW_INSECURE_SSL", releaseAllowInsecureSsl.toString()
            buildConfigField "boolean", "FORCE_FIRESTICK_URL", releaseForceFirestickUrl.toString()
            buildConfigField "String", "FIRESTICK_LOCKED_URL", "\"${escapedReleaseFirestickLockedUrl}\""
            buildConfigField "boolean", "STANDALONE_MODE", standaloneMode.toString()
            buildConfigField "String", "CATALOG_SNAPSHOT_URL", "\"${escapedCatalogSnapshotUrl}\""
            buildConfigField "String", "OFFLINE_BASE_URL", "\"${escapedOfflineBaseUrl}\""
            buildConfigField "String", "EMERGENCY_BASE_URL", "\"${escapedEmergencyBaseUrl}\""
            buildConfigField "String", "UPDATE_CHANNEL", "\"${escapedUpdateChannel}\""
            buildConfigField "boolean", "DNS_HEALING_RECOVERY_FIRST", dnsHealingRecoveryFirst.toString()
            buildConfigField "boolean", "LOG_VERBOSE", "false"
            buildConfigField "String", "OFFLINE_SNAPSHOT_PUBLIC_KEY", "\"${escapedOfflineSnapshotPublicKey}\""
            buildConfigField "String", "OFFLINE_SNAPSHOT_KEY_ID", "\"${escapedOfflineSnapshotKeyId}\""
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.compose.runtime:runtime:1.7.8'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation files(rootProject.file('buildSrc/build/libs/buildSrc.jar'))
    testImplementation 'org.ow2.asm:asm:9.8'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'org.videolan.android:libvlc-all:3.7.5'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Beta-only workaround for Media3 1.11.1 PesReader re-parsing PTS bytes at HLS EOF.
// Retains real malformed-header diagnostics and all stream/codec selection logic.
if (updateChannel == 'beta') {
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(
            com.drbep.build.PesReaderFixFactory,
            com.android.build.api.instrumentation.InstrumentationScope.ALL) {}
        variant.instrumentation.setAsmFramesComputationMode(
            com.android.build.api.instrumentation.FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS)
    }
}

// Emulator builds are development artifacts, never release-channel APKs.
if (emulatorAbiOnly) {
    androidComponents.beforeVariants(androidComponents.selector().withBuildType('release')) { variant ->
        variant.enable = false
    }
}
