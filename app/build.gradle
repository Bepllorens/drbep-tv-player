plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def playerUrl = (project.findProperty('playerUrl') ?: 'https://iptv.bepllorens.com/player.html').toString()
def allowInsecureSsl = (project.findProperty('allowInsecureSsl') ?: 'true').toString().toBoolean()
def forceFirestickUrl = (project.findProperty('forceFirestickUrl') ?: 'false').toString().toBoolean()
def firestickLockedUrl = (project.findProperty('firestickLockedUrl') ?: '').toString()

def debugPlayerUrl = (project.findProperty('debugPlayerUrl') ?: playerUrl).toString()
def debugAllowInsecureSsl = (project.findProperty('debugAllowInsecureSsl') ?: allowInsecureSsl.toString()).toString().toBoolean()
def debugForceFirestickUrl = (project.findProperty('debugForceFirestickUrl') ?: forceFirestickUrl.toString()).toString().toBoolean()
def debugFirestickLockedUrl = (project.findProperty('debugFirestickLockedUrl') ?: firestickLockedUrl).toString()

def releasePlayerUrl = (project.findProperty('releasePlayerUrl') ?: 'https://iptv.bepllorens.com/player.html').toString()
def releaseAllowInsecureSsl = (project.findProperty('releaseAllowInsecureSsl') ?: 'false').toString().toBoolean()
def releaseForceFirestickUrl = (project.findProperty('releaseForceFirestickUrl') ?: 'false').toString().toBoolean()
def releaseFirestickLockedUrl = (project.findProperty('releaseFirestickLockedUrl') ?: '').toString()
def standaloneMode = (project.findProperty('standaloneMode') ?: 'true').toString().toBoolean()
def catalogSnapshotUrl = (project.findProperty('catalogSnapshotUrl') ?: '').toString()
def offlineBaseUrl = (project.findProperty('offlineBaseUrl') ?: 'https://fire.tvbep.com').toString()
def updateChannel = (project.findProperty('updateChannel') ?: 'stable').toString()
def fireAbiOnly = (project.findProperty('fireAbiOnly') ?: 'false').toString().toBoolean()
def offlineSnapshotPublicKey = (project.findProperty('offlineSnapshotPublicKey') ?: '').toString()
def offlineSnapshotKeyId = (project.findProperty('offlineSnapshotKeyId') ?: 'offline-snapshot-rsa-20260520').toString()

def escapedDebugPlayerUrl = debugPlayerUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedDebugFirestickLockedUrl = debugFirestickLockedUrl
    .replace('\\', '\\\\')
    .replace('"', '\\"')
def escapedReleasePlayerUrl = releasePlayerUrl
    .replace('\\', '\\\\')
    .replace('"', '\\"')
def escapedReleaseFirestickLockedUrl = releaseFirestickLockedUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedCatalogSnapshotUrl = catalogSnapshotUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedOfflineBaseUrl = offlineBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedUpdateChannel = updateChannel
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedOfflineSnapshotPublicKey = offlineSnapshotPublicKey
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def escapedOfflineSnapshotKeyId = offlineSnapshotKeyId
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace = 'com.drbep.tvplayer'
    compileSdk 36

    defaultConfig {
        applicationId "com.drbep.tvplayer.offline"
        minSdk 23
        targetSdk 34
        versionCode 432
        versionName "2.0.432-startup-epg-refresh"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            if (fireAbiOnly) {
                abiFilters 'armeabi-v7a'
            } else {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        manifestPlaceholders = [
                appAllowBackup: "false",
                appFullBackupContent: "false",
                appUsesCleartextTraffic: "false"
        ]
    }

    signingConfigs {
        release {
            def releaseStoreFile = project.findProperty('DRBEP_RELEASE_STORE_FILE') ?: System.getenv('DRBEP_RELEASE_STORE_FILE')
            def releaseStorePassword = project.findProperty('DRBEP_RELEASE_STORE_PASSWORD') ?: System.getenv('DRBEP_RELEASE_STORE_PASSWORD')
            def releaseKeyAlias = project.findProperty('DRBEP_RELEASE_KEY_ALIAS') ?: System.getenv('DRBEP_RELEASE_KEY_ALIAS')
            def releaseKeyPassword = project.findProperty('DRBEP_RELEASE_KEY_PASSWORD') ?: System.getenv('DRBEP_RELEASE_KEY_PASSWORD')
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [
                    appAllowBackup: "false",
                    appFullBackupContent: "false",
                    appUsesCleartextTraffic: "true"
            ]
            buildConfigField "String", "PLAYER_URL", "\"${escapedDebugPlayerUrl}\""
            buildConfigField "boolean", "ALLOW_INSECURE_SSL", debugAllowInsecureSsl.toString()
            buildConfigField "boolean", "FORCE_FIRESTICK_URL", debugForceFirestickUrl.toString()
            buildConfigField "String", "FIRESTICK_LOCKED_URL", "\"${escapedDebugFirestickLockedUrl}\""
            buildConfigField "boolean", "STANDALONE_MODE", standaloneMode.toString()
            buildConfigField "String", "CATALOG_SNAPSHOT_URL", "\"${escapedCatalogSnapshotUrl}\""
            buildConfigField "String", "OFFLINE_BASE_URL", "\"${escapedOfflineBaseUrl}\""
            buildConfigField "String", "UPDATE_CHANNEL", "\"${escapedUpdateChannel}\""
            buildConfigField "boolean", "LOG_VERBOSE", "true"
            buildConfigField "String", "OFFLINE_SNAPSHOT_PUBLIC_KEY", "\"${escapedOfflineSnapshotPublicKey}\""
            buildConfigField "String", "OFFLINE_SNAPSHOT_KEY_ID", "\"${escapedOfflineSnapshotKeyId}\""
        }
        release {
            // CI and contributor builds can produce an unsigned release APK;
            // publication still uses the configured production keystore.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders = [
                    appAllowBackup: "false",
                    appFullBackupContent: "false",
                    appUsesCleartextTraffic: "false"
            ]
            buildConfigField "String", "PLAYER_URL", "\"${escapedReleasePlayerUrl}\""
            buildConfigField "boolean", "ALLOW_INSECURE_SSL", releaseAllowInsecureSsl.toString()
            buildConfigField "boolean", "FORCE_FIRESTICK_URL", releaseForceFirestickUrl.toString()
            buildConfigField "String", "FIRESTICK_LOCKED_URL", "\"${escapedReleaseFirestickLockedUrl}\""
            buildConfigField "boolean", "STANDALONE_MODE", standaloneMode.toString()
            buildConfigField "String", "CATALOG_SNAPSHOT_URL", "\"${escapedCatalogSnapshotUrl}\""
            buildConfigField "String", "OFFLINE_BASE_URL", "\"${escapedOfflineBaseUrl}\""
            buildConfigField "String", "UPDATE_CHANNEL", "\"${escapedUpdateChannel}\""
            buildConfigField "boolean", "LOG_VERBOSE", "false"
            buildConfigField "String", "OFFLINE_SNAPSHOT_PUBLIC_KEY", "\"${escapedOfflineSnapshotPublicKey}\""
            buildConfigField "String", "OFFLINE_SNAPSHOT_KEY_ID", "\"${escapedOfflineSnapshotKeyId}\""
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.compose.runtime:runtime:1.7.8'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'org.videolan.android:libvlc-all:3.7.5'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
