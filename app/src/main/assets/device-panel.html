<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRBEP · Dispositivo</title><style>body{margin:0;background:linear-gradient(110deg,#172936,#080e16);color:#edf5fa;font:16px system-ui;min-height:100vh}main{max-width:780px;margin:auto;padding:28px}h1{font-size:30px}input,button{font:inherit;background:#142531;color:inherit;border:1px solid #77909d;border-radius:6px;padding:12px;max-width:100%;box-sizing:border-box}button{cursor:pointer;margin:12px 8px 12px 0}button:focus-visible,input:focus-visible{outline:3px solid #75dbd2}label{display:block;margin:14px 0}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dd{margin:0}section{border-top:1px solid #ffffff22;padding:15px 0}progress{width:100%}.muted{color:#b2c5d1}</style><main><h1>DRBEP · Dispositivo</h1><p class="muted">Conecta con el PIN que aparece en la televisión. La sesión caduca a los 20 minutos.</p><form id="login"><label for="pin">PIN de seis cifras</label><input id="pin" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required><button>Conectar</button></form><p id="message" role="status" aria-live="polite"></p><div id="panel" hidden><section><h2>Estado</h2><dl id="stats"></dl><button id="refresh">Actualizar</button><button id="logout">Desconectar este navegador</button></section><section><h2>Importar una lista</h2><form id="upload"><label for="file">Archivo M3U</label><input id="file" type="file" accept=".m3u,.m3u8,text/plain,audio/x-mpegurl" required><button id="send">Enviar al dispositivo</button><progress id="progress" max="100" value="0" hidden></progress></form></section><section><h2>Importaciones en segundo plano</h2><ul id="jobs"></ul></section><section><h2>Gestionar listas</h2><button id="loadLists">Actualizar listas</button><select id="listSelect" aria-label="Lista"></select><p><button id="renameList">Editar lista</button><button id="syncList">Actualizar contenido</button><button id="guideList">Actualizar guía</button><button id="deleteList">Eliminar lista</button></p><label>Buscar títulos <input id="query" maxlength="200"></label><button id="searchEntries">Buscar</button><label><input type="checkbox" id="favorites">Solo favoritos</label><label><input type="checkbox" id="showHidden">Mostrar ocultos</label><ul id="entries"></ul><button id="previous">Anterior</button><button id="next">Siguiente</button></section><section><h2>Diagnóstico</h2><button id="report">Descargar informe</button></section></div></main><script>
'use strict';const $=id=>document.getElementById(id);let token='',timer;const message=t=>$('message').textContent=t;
function disconnect(){token='';clearInterval(timer);$('panel').hidden=true;$('login').hidden=false}
async function refresh(){if(!token)return;try{const r=await fetch('/status',{headers:{'X-Panel-Token':token},cache:'no-store'});if(r.status===401){disconnect();message('La sesión ha terminado. Abre de nuevo el panel en la TV.');return}if(!r.ok)throw Error();const s=await r.json();$('stats').replaceChildren();for(const [k,v] of Object.entries(s)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=k==='Importaciones'?'Consulta el progreso debajo':Array.isArray(v)?v.join('\n'):String(v);$('stats').append(dt,dd)}await jobs()}catch(e){message('No se puede contactar con el dispositivo.')}}
$('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/session',{method:'POST',body:$('pin').value});if(!r.ok){message('PIN incorrecto o sesión cerrada. Comprueba la TV.');return}token=(await r.json()).token;$('pin').value='';$('login').hidden=true;$('panel').hidden=false;message('Conectado');lists();clearInterval(timer);timer=setInterval(refresh,5000);refresh()}catch(e){message('No se puede contactar con el dispositivo.')}};
$('refresh').onclick=refresh;$('logout').onclick=disconnect;
$('upload').onsubmit=e=>{e.preventDefault();const file=$('file').files[0];if(!file||!token)return;if(file.size>256*1024*1024){message('El límite por archivo es de 256 MB.');return}const xhr=new XMLHttpRequest();xhr.open('POST','/playlist');xhr.setRequestHeader('X-Panel-Token',token);xhr.setRequestHeader('Content-Type','audio/x-mpegurl');xhr.timeout=600000;$('send').disabled=true;$('progress').hidden=false;message('Enviando lista…');xhr.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100};xhr.upload.onload=()=>message('Procesando lista…');const done=()=>{$('send').disabled=false;$('progress').hidden=true};xhr.onload=()=>{done();if(xhr.status===200){const result=JSON.parse(xhr.responseText);message(result.queued?'Archivo recibido. La importación continuará aunque cierres esta página.':'Lista importada: '+result.entries+' elementos.');lists();}else message('No se pudo importar. Revisa el archivo, la sesión y el espacio libre.');refresh()};xhr.onerror=xhr.ontimeout=()=>{done();message('Se ha interrumpido la conexión. Comprueba Mis listas en la TV antes de repetir.');};xhr.send(file)};

let offset=0;
async function manage(action,fields={}){const r=await fetch('/manage',{method:'POST',headers:{'X-Panel-Token':token,'Content-Type':'application/json'},body:JSON.stringify({action,source:$('listSelect').value,...fields})});if(!r.ok)throw Error('Operación rechazada');return r.json()}
async function lists(){try{const data=await manage('lists');$('listSelect').replaceChildren();for(const source of data.sources){const option=document.createElement('option');option.value=source.id;option.textContent=source.name+' · '+source.origin+(source.updated===0?' · Importación en curso':'');$('listSelect').append(option)}offset=0;await entries()}catch(e){message('No se pudieron cargar las listas.')}}
async function entries(){if(!$('listSelect').value){$('entries').replaceChildren();return}try{const data=await manage('entries',{query:$('query').value,offset,favorites:$('favorites').checked,hidden:$('showHidden').checked});$('entries').replaceChildren();$('previous').disabled=offset===0;$('next').disabled=data.entries.length<50;for(const row of data.entries){const li=document.createElement('li');li.style.marginBottom='14px';const title=document.createElement('span');title.textContent=row.title+' · '+row.kind;li.append(title);for(const [text,change] of [[row.favorite?'Quitar favorito':'Favorito',{favorite:!row.favorite}],[row.hidden?'Mostrar':'Ocultar',{hidden:!row.hidden}],['Renombrar',null],['Orden',null]]){const button=document.createElement('button');button.textContent=text;button.onclick=async()=>{let update=change;if(text==='Renombrar'){const label=prompt('Nombre del título',row.title);if(label===null)return;update={label}}if(text==='Orden'){const order=prompt('Orden: valores menores aparecen antes (0 = orden de la lista)','0');if(order===null||!Number.isInteger(Number(order)))return;update={order:Number(order)}}try{await manage('preference',{identity:row.identity,occurrence:row.occurrence,favorite:row.favorite,hidden:row.hidden,...update});await entries()}catch(e){message('No se pudo guardar el cambio.')}};li.append(button)}$('entries').append(li)}}catch(e){message('No se pudo consultar el contenido.')}}
async function jobs(){const data=await manage('jobs');$('jobs').replaceChildren();for(const job of data.jobs){const li=document.createElement('li');li.textContent=job.name+' · '+job.phase+' · '+job.count+' elementos';if(['queued','running','retry'].includes(job.state)){const cancel=document.createElement('button');cancel.textContent='Cancelar';cancel.onclick=async()=>{try{await manage('cancel-job',{job:job.id});await jobs()}catch(e){message('No se pudo cancelar')}};li.append(cancel)}$('jobs').append(li)}if(data.jobs.some(j=>['queued','running','retry'].includes(j.state)||Date.now()-j.updated<15000))await syncListOptions()}
async function syncListOptions(){const data=await manage('lists'),select=$('listSelect'),previous=select.value;const incoming=JSON.stringify(data.sources.map(s=>[s.id,s.name,s.updated===0]));if(select.dataset.snapshot===incoming)return;select.dataset.snapshot=incoming;select.replaceChildren();for(const source of data.sources){const option=document.createElement('option');option.value=source.id;option.textContent=source.name+(source.updated===0?' · Importación en curso':'');select.append(option)}if(data.sources.some(s=>s.id===previous))select.value=previous;if(select.value!==previous){offset=0;await entries()}}
$('loadLists').onclick=lists;$('listSelect').onchange=()=>{offset=0;entries()};$('searchEntries').onclick=()=>{offset=0;entries()};$('favorites').onchange=$('showHidden').onchange=()=>{offset=0;entries()};$('previous').onclick=()=>{offset=Math.max(0,offset-50);entries()};$('next').onclick=()=>{offset+=50;entries()};
for(const [id,action] of [['syncList','refresh'],['guideList','guide']])$(id).onclick=async()=>{try{await manage(action);message('Actualización solicitada. El resultado aparecerá en la TV.')}catch(e){message('No se pudo solicitar la actualización.')}};
$('renameList').onclick=async()=>{if(!$('listSelect').value)return;const name=prompt('Nombre de la lista');if(!name)return;const url=prompt('Nueva URL de actualización (vacío para conservar la actual)','');if(url===null)return;const epg=prompt('URL XMLTV de la guía (vacío para conservar la actual)','');if(epg===null)return;const automatic=confirm('¿Actualizar automáticamente cada 12 horas cuando haya conexión?');try{await manage('configure',{name,automatic,...(url?{url}:{}),...(epg?{epg}:{})});await lists()}catch(e){message('No se pudo guardar la configuración.')}};
$('deleteList').onclick=async()=>{if(!confirm('¿Eliminar esta lista y sus preferencias del dispositivo?'))return;try{await manage('delete');await lists()}catch(e){message('No se pudo eliminar la lista.')}};
$('report').onclick=async()=>{try{const r=await fetch('/report',{headers:{'X-Panel-Token':token}});if(!r.ok)throw Error();const blob=new Blob([JSON.stringify(await r.json(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='drbep-diagnostico.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){message('No se pudo descargar el informe.')}};
document.addEventListener('visibilitychange',()=>{clearInterval(timer);if(!document.hidden&&token){refresh();timer=setInterval(refresh,5000)}});
</script></html>
